apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: etcdbackups.clusterops.io
spec:
  group: clusterops.io
  scope: Namespaced
  names:
    kind: EtcdBackup
    plural: etcdbackups
    singular: etcdbackup
    shortNames:
      - etcdbackup
      - eb
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # NOTE: the status subresource is intentionally NOT enabled.
      # The operator writes status through patch.status on the main
      # resource, which is ignored when a status subresource exists.
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                schedule:
                  type: string
                  default: "0 */4 * * *"
                  description: Cron expression (5 fields), evaluated in UTC.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                lastBackup:
                  type: string
                lastBackupAttempt:
                  type: string
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: LastBackup
          type: string
          jsonPath: .status.lastBackup
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
