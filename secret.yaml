# Do NOT commit real credentials. Alternative without a file:
#
#   kubectl -n etcd-backup create secret generic cloudian-credentials \
#     --from-literal=CLOUDIAN_ACCESS_KEY='<access-key>' \
#     --from-literal=CLOUDIAN_SECRET_KEY='<secret-key>'
apiVersion: v1
kind: Secret
metadata:
  name: cloudian-credentials
  namespace: etcd-backup
type: Opaque
stringData:
  CLOUDIAN_ACCESS_KEY: "xxxxxxxxxxxxxxx"
  CLOUDIAN_SECRET_KEY: "xxxxxxxxxxxxxx"
